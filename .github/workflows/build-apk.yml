name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.4
      - name: Create Project
        run: |
          rm -rf project
          mkdir -p project/app/src/main/java/com/maseko/tsogolani
          mkdir -p project/app/src/main/res/values
          mkdir -p project/app/src/main/assets
          echo 'rootProject.name = "Tsogolani"' > project/settings.gradle
          echo "include ':app'" >> project/settings.gradle
          echo "plugins { id 'com.android.application' version '8.1.4' apply false }" > project/build.gradle
          echo "plugins { id 'com.android.application' }" > project/app/build.gradle
          echo "android { namespace 'com.maseko.tsogolani'; compileSdk 34; defaultConfig { applicationId \"com.maseko.tsogolani\"; minSdk 21; targetSdk 34; versionCode 16; versionName \"1.0.16\" }; buildTypes { release { minifyEnabled false } }; compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 } } dependencies { implementation 'androidx.appcompat:appcompat:1.6.1' }" >> project/app/build.gradle
          echo '<manifest xmlns:android="http://schemas.android.com/apk/res/android"><application android:label="Tsogolani Library" android:theme="@android:style/Theme.NoTitleBar"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>' > project/app/src/main/AndroidManifest.xml
          echo '<resources><string name="app_name">Tsogolani Library</string></resources>' > project/app/src/main/res/values/strings.xml
          HTML=$(ls *.html | head -n 1)
          cp "$HTML" project/app/src/main/assets/library.html
          cp *.html project/app/src/main/assets/ || true
          mkdir -p project/app/src/main/java/com/maseko/tsogolani
          printf 'package com.maseko.tsogolani\nimport android.app.Activity\nimport android.os.Bundle\nimport android.webkit.WebView\nclass MainActivity : Activity() {\n override fun onCreate(b: Bundle?) {\n super.onCreate(b)\n val w = WebView(this)\n w.settings.javaScriptEnabled = true\n w.loadUrl("file:///android_asset/library.html")\n setContentView(w)\n }\n}\n' > project/app/src/main/java/com/maseko/tsogolani/MainActivity.kt
      - name: Build APK
        run: |
          cd project
          gradle wrapper
          chmod +x gradlew
         ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Tsogolani-APK
          path: project/app/build/outputs/apk/debug/*.apk
