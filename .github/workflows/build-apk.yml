
name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Unzip project
        run: |
          ls
          unzip -o *.zip -d app_src
          ls -R app_src | head -n 200
      - name: Make gradlew executable
        run: |
          find app_src -name gradlew -exec chmod +x {} \;
      - name: Build APK
        run: |
          GRADLE_DIR=$(find app_src -name "gradlew" | head -n 1 | xargs dirname)
          echo "Gradle dir $GRADLE_DIR"
          cd "$GRADLE_DIR"
         ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Tsogolani-Library-APK
          path: "**/build/outputs/apk/debug/*.apk"
