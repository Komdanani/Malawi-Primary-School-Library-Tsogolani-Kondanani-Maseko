name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Unzip
        run: |
          unzip -o *.zip -d src
          ls src
      - name: Build APK
        run: |
          chmod +x $(find src -name gradlew)
          find src -name gradlew -execdir./gradlew assembleDebug --stacktrace \;
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Tsogolani-Library-APK
          path: '**/build/outputs/apk/debug/*.apk'
