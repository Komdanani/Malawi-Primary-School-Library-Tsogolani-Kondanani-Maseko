name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.4
      - run: |
          rm -rf project
          mkdir -p project/app/src/main/java/com/maseko/tsogolani
          mkdir -p project/app/src/main/res/values
          mkdir -p project/app/src/main/assets
          echo cm9vdFByb2plY3QubmFtZSA9ICJUc29nb2xhbmkiCmluY2x1ZGUgIjphcHAiCg== | base64 -d > project/settings.gradle
          echo cGx1Z2lucyB7IGlkICJjb20uYW5kcm9pZC5hcHBsaWNhdGlvbiIgdmVyc2lvbiAiOC4xLjQiIGFwcGx5IGZhbHNlIH0K | base64 -d > project/build.gradle
          echo  | base64 -d > project/app/build.gradle
          echo  | base64 -d > project/app/src/main/AndroidManifest.xml
          echo PHJlc291cmNlcz48c3RyaW5nIG5hbWU9ImFwcF9uYW1lIj5Uc29nb2xhbmkgTGlicmFyeTwvc3RyaW5nPjwvcmVzb3VyY2VzPg== | base64 -d > project/app/src/main/res/values/strings.xml
          echo  | base64 -d > project/app/src/main/java/com/maseko/tsogolani/MainActivity.kt
          cp Malawi_Primary_School_Book_Library.html project/app/src/main/assets/library.html
      - run: |
          cd project
          gradle wrapper
          chmod +x gradlew
         ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Tsogolani-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
