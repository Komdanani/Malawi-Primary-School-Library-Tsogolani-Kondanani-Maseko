name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.4
      - name: Create Project
        shell: python
        run: |
          import pathlib, shutil, glob, base64 as b64
          p1="project/app/src/main/java/com/maseko/tsogolani"
          p2="project/app/src/main/res/values"
          p3="project/app/src/main/assets"
          pathlib.Path(p1).mkdir(parents=True, exist_ok=True)
          pathlib.Path(p2).mkdir(parents=True, exist_ok=True)
          pathlib.Path(p3).mkdir(parents=True, exist_ok=True)
          open("project/settings.gradle","wb").write(b64.b64decode("cm9vdFByb2plY3QubmFtZSA9ICJUc29nb2xhbmkiCmluY2x1ZGUgIjphcHAiCg=="))
          open("project/build.gradle","wb").write(b64.b64decode("cGx1Z2lucyB7IGlkICJjb20uYW5kcm9pZC5hcHBsaWNhdGlvbiIgdmVyc2lvbiAiOC4xLjQiIGFwcGx5IGZhbHNlIH0K"))
          open("project/app/build.gradle","wb").write(b64.b64decode(""))
          open("project/app/src/main/AndroidManifest.xml","wb").write(b64.b64decode(""))
          open("project/app/src/main/res/values/strings.xml","wb").write(b64.b64decode("PHJlc291cmNlcz48c3RyaW5nIG5hbWU9ImFwcF9uYW1lIj5Uc29nb2xhbmkgTGlicmFyeTwvc3RyaW5nPjwvcmVzb3VyY2VzPg=="))
          open("project/app/src/main/java/com/maseko/tsogolani/MainActivity.kt","wb").write(b64.b64decode(""))
          htmls=glob.glob("*.html")
          shutil.copy(htmls[0],"project/app/src/main/assets/library.html")
      - name: Build APK
        run: |
          cd project
          gradle wrapper
          chmod +x gradlew
         ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Tsogolani-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
