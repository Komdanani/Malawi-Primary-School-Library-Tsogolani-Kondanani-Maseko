name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Unzip and Find
        run: |
          unzip -o *.zip -d project
          echo "=== LIST ALL ==="
          ls -R project | head -n 300
          echo "=== SEARCH GRADLEW ==="
          find project -type f | grep gradle | head -n 30
      - name: Build APK
        run: |
          FILE=$(find project -type f -name gradlew | head -n 1)
          if [ -z "$FILE" ]; then echo "ERROR gradlew not found"; exit 1; fi
          echo "Found $FILE"
          chmod +x $FILE
          $FILE -p $(dirname $FILE) assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Tsogolani-APK
          path: '**/apk/debug/*.apk'
