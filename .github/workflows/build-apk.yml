name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Unzip
        run: unzip -o *.zip -d src
      - name: Build
        run: |
          chmod +x $(find src -name gradlew)
          find src -name gradlew -execdir./gradlew assembleDebug \;
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Tsogolani-APK
          path: '**/build/outputs/apk/debug/*.apk'
