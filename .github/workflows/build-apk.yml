name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Android
        uses: android-actions/setup-android@v3
      - name: Unzip
        run: |
          unzip -o *.zip -d src
          ls src
      - name: Build
        run: |
          chmod +x $(find src -name gradlew)
          DIR=$(find src -name gradlew | head -n 1 | xargs dirname)
          cd $DIR
         ./gradlew assembleDebug
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Tsogolani-APK
          path: '**/build/outputs/apk/debug/*.apk'
