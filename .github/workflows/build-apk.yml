
name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Unzip project
        run: |
          ls -lh
          ZIP=$(ls *.zip | head -n 1)
          echo "Found $ZIP"
          rm -rf src extracted
          unzip -o "$ZIP" -d extracted
          ls -R extracted | head -n 100
      - name: Build APK
        run: |
          GRADLEW=$(find extracted -name gradlew -type f | head -n 1)
          echo "Found gradlew at $GRADLEW"
          chmod +x "$GRADLEW"
          DIR=$(dirname "$GRADLEW")
          cd "$DIR"
         ./gradlew assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Tsogolani-Library-APK
          path: '**/build/outputs/apk/debug/*.apk'
