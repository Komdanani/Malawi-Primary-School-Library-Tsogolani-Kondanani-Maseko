name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Unzip
        run: |
          ZIP=$(ls *.zip | head -n 1)
          unzip -o "$ZIP" -d app
          ls -R app | head -n 150
      - name: Build Debug APK
        run: |
          FILE=$(find app -name gradlew -type f | head -n 1)
          echo "Gradlew: $FILE"
          chmod +x "$FILE"
          cd $(dirname "$FILE")
         ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Tsogolani-Library-APK
          path: '**/outputs/apk/debug/*.apk'
