name: Build APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build APK from HTML
        run: |
          ls -la *.html
          mkdir -p www
          cp -v *.html www/index.html
          npx --yes @capacitor/cli@latest init "Tsogolani Library" "com.komdana.tsogolani" --web-dir=www
          npm install @capacitor/core @capacitor/android
          npx cap add android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Tsogolani-Library-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
