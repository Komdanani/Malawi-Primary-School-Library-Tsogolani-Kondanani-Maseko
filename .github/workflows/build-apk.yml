name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: unzip -o *.zip -d project
      - run: ls -R project
      - run: FILE=$(find project -name gradlew | head -n 1); echo Found $FILE; chmod +x $FILE; sh $FILE -p $(dirname $FILE) assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Tsogolani-APK
          path: '**/*.apk'
