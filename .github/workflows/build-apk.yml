name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.4
      - name: Make project
        shell: python
        run: |
          import pathlib, shutil, glob
          pathlib.Path("project/app/src/main/java/com/maseko/tsogolani").mkdir(parents=True, exist_ok=True)
          pathlib.Path("project/app/src/main/res/values").mkdir(parents=True, exist_ok=True)
          pathlib.Path("project/app/src/main/assets").mkdir(parents=True, exist_ok=True)
          open("project/settings.gradle","w").write('rootProject.name = "Tsogolani"\ninclude ":app"\n')
          open("project/build.gradle","w").write('buildscript { repositories { google(); mavenCentral() }; dependencies { classpath "com.android.tools.build:gradle:8.1.4" } }\nallprojects { repositories { google(); mavenCentral() } }\n')
          open("project/app/build.gradle","w").write('apply plugin: "com.android.application"\nandroid { namespace "com.maseko.tsogolani"\n compileSdk 34\n defaultConfig { applicationId "com.maseko.tsogolani"\n minSdk 21\n targetSdk 34\n versionCode 26\n versionName "1.0.26" } }\ndependencies { }\n')
          open("project/app/src/main/AndroidManifest.xml","w").write('<manifest xmlns:android="http://schemas.android.com/apk/res/android"><application android:label="Tsogolani"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>')
          open("project/app/src/main/res/values/strings.xml","w").write('<resources><string name="app_name">Tsogolani Library</string></resources>')
          open("project/app/src/main/java/com/maseko/tsogolani/MainActivity.kt","w").write('package com.maseko.tsogolani\nimport android.app.Activity\nimport android.os.Bundle\nimport android.webkit.WebView\nclass MainActivity : Activity() { override fun onCreate(b: Bundle?) { super.onCreate(b)\n val w=WebView(this)\n w.settings.javaScriptEnabled=true\n w.loadUrl("file:///android_asset/library.html")\n setContentView(w) } }\n')
          shutil.copy(glob.glob("*.html")[0],"project/app/src/main/assets/library.html")
      - name: Build APK
        run: cd project && gradle wrapper && chmod +x gradlew &&./gradlew assembleDebug --info
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Tsogolani-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
