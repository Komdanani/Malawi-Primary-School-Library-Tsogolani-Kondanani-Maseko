name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build Tsogolani Library APK
        run: |
          rm -rf project
          mkdir -p project/app/src/main/java/com/maseko/tsogolani
          mkdir -p project/app/src/main/res/values
          mkdir -p project/app/src/main/assets
          echo 'rootProject.name = "Tsogolani"' > project/settings.gradle
          echo "include ':app'" >> project/settings.gradle
          echo "plugins { id 'com.android.application' version '8.1.4' apply false }" > project/build.gradle
          cat > project/app/build.gradle << 'END'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.maseko.tsogolani'
            compileSdk 34
            defaultConfig { applicationId "com.maseko.tsogolani"; minSdk 21; targetSdk 34; versionCode 16; versionName "1.0.16" }
            buildTypes { release { minifyEnabled false } }
            compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
          }
          dependencies { implementation 'androidx.appcompat:appcompat:1.6.1' }
          END
          echo '<manifest xmlns:android="http://schemas.android.com/apk/res/android"><application android:label="Tsogolani Library" android:theme="@android:style/Theme.NoTitleBar"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>' > project/app/src/main/AndroidManifest.xml
          echo '<resources><string name="app_name">Tsogolani Library</string></resources>' > project/app/src/main/res/values/strings.xml
          HTML=$(ls *.html | head -n 1)
          echo "Found HTML: $HTML"
          cp "$HTML" project/app/src/main/assets/library.html
          cp *.html project/app/src/main/assets/ || true
          ls project/app/src/main/assets/
          cat > project/app/src/main/java/com/maseko/tsogolani/MainActivity.kt << 'END'
          package com.maseko.tsogolani
          import android.app.Activity
          import android.os.Bundle
          import android.webkit.WebView
          class MainActivity : Activity() {
            override fun onCreate(b: Bundle?) {
              super.onCreate(b)
              val w = WebView(this)
              w.settings.javaScriptEnabled = true
              w.settings.allowFileAccess = true
              w.loadUrl("file:///android_asset/library.html")
              setContentView(w)
            }
          }
          END
      - name: Make Gradle Wrapper
        uses: gradle/gradle-build-action@v3
        with:
          arguments: wrapper --gradle-version 8.4
          build-root-directory: project
      - name: Assemble APK
        run: |
          cd project
          chmod +x gradlew
         ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Tsogolani-APK
          path: project/app/build/outputs/apk/debug/*.apk
