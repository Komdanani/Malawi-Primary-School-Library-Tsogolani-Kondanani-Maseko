name: Build APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Create Android Project
        run: |
          rm -rf project
          mkdir -p project/app/src/main/java/com/maseko/tsogolani
          mkdir -p project/app/src/main/res/values
          mkdir -p project/app/src/main/assets

          cat > project/settings.gradle <<'EOF'
          rootProject.name = "Tsogolani"
          include ":app"
          EOF

          cat > project/build.gradle <<'EOF'
          plugins { id "com.android.application" version "8.1.4" apply false }
          EOF

          cat > project/app/build.gradle <<'EOF'
          plugins { id "com.android.application" }
          android {
            namespace "com.maseko.tsogolani"
            compileSdk 34
            defaultConfig {
              applicationId "com.maseko.tsogolani"
              minSdk 21
              targetSdk 34
              versionCode 17
              versionName "1.0.17"
            }
          }
          dependencies {
            implementation "androidx.appcompat:appcompat:1.6.1"
          }
          EOF

          cat > project/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application android:label="Tsogolani">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF

          cat > project/app/src/main/res/values/strings.xml <<'EOF'
          <resources><string name="app_name">Tsogolani Library</string></resources>
          EOF

          cat > project/app/src/main/java/com/maseko/tsogolani/MainActivity.kt <<'EOF'
          package com.maseko.tsogolani
          import android.app.Activity
          import android.os.Bundle
          import android.webkit.WebView
          class MainActivity : Activity() {
            override fun onCreate(b: Bundle?) {
              super.onCreate(b)
              val w = WebView(this)
              w.settings.javaScriptEnabled = true
              w.loadUrl("file:///android_asset/library.html")
              setContentView(w)
            }
          }
          EOF

          HTML=$(ls *.html | head -n 1)
          echo "Using HTML: $HTML"
          cp "$HTML" project/app/src/main/assets/library.html
          ls -l project/app/src/main/assets/

      - name: Build with Gradle
        run: |
          cd project
          gradle wrapper --gradle-version 8.4
          chmod +x gradlew
         ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Tsogolani-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
